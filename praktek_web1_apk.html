<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Operator JavaScript</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .box{
            width: 400px;
            padding: 20px;
            border: 2px solid black;
            border-radius: 10px;
        }

        h2{
            color: darkblue;
        }
    </style>
</head>
<body>

    <div class="box">
        <h2>Aplikasi Belanja Sederhana</h2>

        <p id="harga"></p>
        <p id="jumlah"></p>
        <p id="total"></p>
        <p id="diskon"></p>
        <p id="status"></p>
    </div>

    <script>

        // =========================
        // OPERATOR PENUGASAN
        // =========================
        let hargaBarang = 50000;
        let jumlahBarang = 3;

        // =========================
        // OPERATOR ARITMATIKA
        // =========================
        let totalHarga = hargaBarang * jumlahBarang;

        // tambah pajak
        totalHarga += 5000;

        // =========================
        // OPERATOR PEMBANDING
        // =========================
        let dapatDiskon = totalHarga > 100000;

        // =========================
        // MENAMPILKAN OUTPUT
        // =========================
        document.getElementById("harga").innerHTML =
            "Harga Barang : Rp " + hargaBarang;

        document.getElementById("jumlah").innerHTML =
            "Jumlah Barang : " + jumlahBarang;

        document.getElementById("total").innerHTML =
            "Total Harga + Pajak : Rp " + totalHarga;

        document.getElementById("diskon").innerHTML =
            "Dapat Diskon? : " + dapatDiskon;

        // =========================
        // PENGKONDISIAN
        // =========================
        if (dapatDiskon) {
            document.getElementById("status").innerHTML =
                "Selamat, Anda mendapatkan diskon!";
        } else {
            document.getElementById("status").innerHTML =
                "Maaf, Anda belum mendapatkan diskon.";
        }

    </script>

</body>
</html>
